<!DOCTYPE html>  <html>  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
<title>Tom Runner</title>  <style>  
*{  
  box-sizing:border-box;  
  user-select:none;  
  -webkit-user-select:none;  
}  
  
html,body{  
  margin:0;  
  padding:0;  
  width:100%;  
  height:100%;  
  overflow:hidden;  
  font-family:Arial,sans-serif;  
  background:#0b1240;  
}  
  
/* SKY */  
#sky{  
  position:fixed;  
  inset:0;  
  z-index:0;  
  background:linear-gradient(  
    #4dbfff 0%,  
    #bcecff 65%,  
    #eaffff 100%  
  );  
}  
  
.cloud{  
  position:fixed;  
  width:110px;  
  height:35px;  
  background:#fff;  
  border-radius:40px;  
  opacity:.75;  
  z-index:1;  
  animation:cloudMove 18s linear infinite;  
}  
  
.cloud:before,  
.cloud:after{  
  content:"";  
  position:absolute;  
  background:#fff;  
  border-radius:50%;  
}  
  
.cloud:before{  
  width:50px;  
  height:50px;  
  left:18px;  
  top:-22px;  
}  
  
.cloud:after{  
  width:65px;  
  height:65px;  
  right:12px;  
  top:-32px;  
}  
  
.cloud1{  
  top:90px;  
  left:100%;  
}  
  
.cloud2{  
  top:180px;  
  left:130%;  
  transform:scale(.7);  
  animation-duration:25s;  
}  
  
@keyframes cloudMove{  
  from{transform:translateX(0);}  
  to{transform:translateX(-150vw);}  
}  
  
/* MOUNTAINS */  
#mountains{  
  position:fixed;  
  left:0;  
  bottom:100px;  
  width:200%;  
  height:180px;  
  z-index:2;  
  background:  
    linear-gradient(  
      135deg,  
      transparent 45%,  
      #72b37a 45%,  
      #72b37a 60%,  
      transparent 60%  
    );  
  background-size:260px 180px;  
  animation:mountainMove 12s linear infinite;  
}  
  
@keyframes mountainMove{  
  from{transform:translateX(0);}  
  to{transform:translateX(-260px);}  
}  
  
/* TOP UI */  
#ui{  
  position:fixed;  
  top:calc(10px + env(safe-area-inset-top,0px));  
  left:12px;  
  z-index:60;  
  color:#fff;  
  text-shadow:2px 2px 3px #222;  
}  
  
#score{  
  font-size:22px;  
  font-weight:bold;  
}  
  
#highScore{  
  font-size:17px;  
  margin-top:3px;  
}  
  
#lives{  
  font-size:20px;  
  margin-top:3px;  
}  
  
#level{  
  font-size:16px;  
  margin-top:3px;  
}  
  
#speedBox{  
  position:fixed;  
  top:calc(12px + env(safe-area-inset-top,0px));  
  right:110px;  
  z-index:60;  
  color:#fff;  
  font-size:15px;  
  font-weight:bold;  
  text-shadow:2px 2px 3px #222;  
}  
  
/* PAUSE */  
#pauseBtn{  
  position:fixed;  
  top:calc(10px + env(safe-area-inset-top,0px));  
  right:12px;  
  width:88px;  
  height:40px;  
  z-index:70;  
  border:0;  
  border-radius:22px;  
  background:rgba(0,0,0,.55);  
  color:#fff;  
  font-size:15px;  
  font-weight:bold;  
  touch-action:none;  
}  
  
#pauseBtn:active{  
  transform:scale(.92);  
}  
  
/* GROUND */  
#ground{  
  position:fixed;  
  bottom:0;  
  width:100%;  
  height:100px;  
  background:#3caf3c;  
  border-top:7px solid #267526;  
  z-index:5;  
}  
  
/* ROAD */  
#road{  
  position:fixed;  
  bottom:0;  
  width:100%;  
  height:55px;  
  background:#555;  
  z-index:6;  
}  
  
.roadLine{  
  position:absolute;  
  width:90px;  
  height:7px;  
  background:#fff;  
  bottom:25px;  
  animation:roadMove .8s linear infinite;  
}  
  
.line1{left:0}  
.line2{left:120px}  
.line3{left:240px}  
.line4{left:360px}  
.line5{left:480px}  
.line6{left:600px}  
  
@keyframes roadMove{  
  from{transform:translateX(0);}  
  to{transform:translateX(-120px);}  
}  
  
/* CHARACTER */  
#character{  
  position:fixed;  
  left:80px;  
  bottom:100px;  
  width:82px;height:104px;  
  z-index:30;  
}  
#character img{width:100%;height:100%;object-fit:contain;}
.head{  
  position:absolute;  
  top:0;  
  left:9px;  
  width:38px;  
  height:38px;  
  background:#ffd09b;  
  border:2px solid #333;  
  border-radius:50%;  
}  
  
.body{  
  position:absolute;  
  top:36px;  
  left:15px;  
  width:28px;  
  height:40px;  
  background:#1976d2;  
  border-radius:8px;  
}  
  
.arm{  
  position:absolute;  
  top:40px;  
  width:7px;  
  height:40px;  
  background:#ffd09b;  
  border-radius:10px;  
  transform-origin:top center;  
}  
  
.leftArm{  
  left:9px;  
  animation:arm1 .25s infinite alternate;  
}  
  
.rightArm{  
  right:9px;  
  animation:arm2 .25s infinite alternate;  
}  
  
@keyframes arm1{  
  from{transform:rotate(28deg);}  
  to{transform:rotate(-28deg);}  
}  
  
@keyframes arm2{  
  from{transform:rotate(-28deg);}  
  to{transform:rotate(28deg);}  
}  
  
.leg{  
  position:absolute;  
  top:72px;  
  width:9px;  
  height:40px;  
  background:#222;  
  border-radius:10px;  
  transform-origin:top center;  
}  
  
.leftLeg{  
  left:15px;  
  animation:leg1 .25s infinite alternate;  
}  
  
.rightLeg{  
  right:15px;  
  animation:leg2 .25s infinite alternate;  
}  
  
@keyframes leg1{  
  from{transform:rotate(-25deg);}  
  to{transform:rotate(25deg);}  
}  
  
@keyframes leg2{  
  from{transform:rotate(25deg);}  
  to{transform:rotate(-25deg);}  
}  
  
.hitFlash{  
  animation:hitFlash .12s infinite alternate;  
}  
  
@keyframes hitFlash{  
  from{opacity:.2;}  
  to{opacity:1;}  
}  
  
/* COIN */  
.coin{  
  position:fixed;  
  width:32px;  
  height:32px;  
  border-radius:50%;  
  background:gold;  
  border:4px solid #d99a00;  
  box-shadow:  
    0 0 8px gold,  
    0 0 18px gold;  
  z-index:25;  
  animation:coinSpin .5s linear infinite;  
}  
  
.coin::after{  
  content:"★";  
  position:absolute;  
  left:5px;  
  top:0;  
  color:#fff;  
  font-size:17px;  
}  
  
@keyframes coinSpin{  
  0%{transform:scaleX(1);}  
  50%{transform:scaleX(.35);}  
  100%{transform:scaleX(1);}  
}  
  
/* OBSTACLES */  
.obstacle{  
  position:fixed;  
  z-index:25;  
}  
  
.block{  
  width:42px;  
  height:58px;  
  background:#8b4513;  
  border:4px solid #572a0a;  
  border-radius:7px;  
}  
  
.spike{  
  width:46px;  
  height:46px;  
  background:#444;  
  clip-path:polygon(  
    50% 0%,  
    100% 100%,  
    0% 100%  
  );  
}  
  
.rock{  
  width:55px;  
  height:45px;  
  background:#666;  
  border:4px solid #444;  
  border-radius:55% 45% 45% 50%;  
}  
  
.wall{  
  width:72px;  
  height:65px;  
  background:#a52a2a;  
  border:5px solid #661111;  
  border-radius:5px;  
}  
  
.barrel{  
  width:48px;  
  height:55px;  
  background:#d88b20;  
  border:5px solid #784700;  
  border-radius:12px;  
}  
  
.upper{  
  width:62px;  
  height:48px;  
  background:#663399;  
  border:4px solid #3d1c5c;  
  border-radius:8px;  
}  
  
/* JUMP */  
#jumpBtn{  
  position:fixed;  
  right:20px;  
  bottom:calc(20px + env(safe-area-inset-bottom,0px));  
  width:105px;  
  height:68px;  
  border:0;  
  border-radius:35px;  
  background:rgba(0,0,0,.6);  
  color:#fff;  
  font-size:20px;  
  font-weight:bold;  
  z-index:70;  
  touch-action:none;  
}  
  
#jumpBtn:active{  
  transform:scale(.9);  
}  
  
.heart{position:fixed;width:34px;height:34px;font-size:30px;line-height:34px;text-align:center;z-index:25;filter:drop-shadow(0 0 8px #ff4d6d);animation:heartBeat .6s ease-in-out infinite alternate;}
@keyframes heartBeat{from{transform:scale(1);}to{transform:scale(1.2);}}

#muteBtn{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:12px;width:88px;height:36px;z-index:70;border:0;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:bold;touch-action:none;}

/* START */  
#startScreen{  
  position:fixed;  
  inset:0;  
  z-index:200;  
  background:  
    linear-gradient(  
      rgba(0,0,0,.55),  
      rgba(0,0,0,.75)  
    );  
  color:#fff;  
  text-align:center;  
  padding-top:18vh;  
}  
  
#startScreen h1{  
  font-size:45px;  
  margin:0;  
  text-shadow:3px 3px 4px #000;  
}  
  
#startScreen p{  
  font-size:18px;  
}  
  
#startBtn{  
  margin-top:20px;  
  padding:15px 40px;  
  border:0;  
  border-radius:30px;  
  font-size:22px;  
  font-weight:bold;  
}  
  
/* PAUSE SCREEN */  
#pauseScreen{  
  display:none;  
  position:fixed;  
  inset:0;  
  z-index:150;  
  background:rgba(0,0,0,.65);  
  color:#fff;  
  text-align:center;  
  padding-top:32vh;  
}  
  
#pauseScreen h1{  
  font-size:42px;  
}  
  
#resumeBtn{  
  padding:14px 30px;  
  border:0;  
  border-radius:12px;  
  font-size:20px;  
}  
  
/* GAME OVER */  
#gameOver{  
  display:none;  
  position:fixed;  
  inset:0;  
  z-index:180;  
  background:rgba(0,0,0,.8);  
  color:#fff;  
  text-align:center;  
  padding-top:24vh;  
}  
  
#gameOver h1{  
  font-size:44px;  
  margin:0 0 10px;  
}  
  
#finalScore{  
  font-size:23px;  
}  
  
#bestScore{  
  font-size:20px;  
}  
  
#newRecord{  
  display:none;  
  font-size:21px;  
}  
  
#restart{  
  padding:14px 28px;  
  border:0;  
  border-radius:12px;  
  font-size:20px;  
}  
  
@media(max-height:600px){  
  #startScreen{  
    padding-top:10vh;  
  }  
  
  #gameOver{  
    padding-top:15vh;  
  }  
}

#bgWrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0b1240;}
.bgLayer{position:absolute;left:0;width:100%;overflow:hidden;}

#bgNearLayer{bottom:0;height:27.4%;}
.bgTrack{display:flex;height:100%;width:max-content;will-change:transform;}

/* AUDIO */  
  
let audioContext=null;  
  
function initAudio(){  
  
  if(!audioContext){  
  
    try{  
  
      audioContext=  
      new (  
        window.AudioContext ||  
        window.webkitAudioContext  
      )();  
  
    }catch(e){}  
  
  }  
  
}  
  
function sound(  
  freq,  
  dur,  
  type="sine"  
){  
  
  if(!audioContext) return;  
  
  const osc=  
  audioContext.createOscillator();  
  
  const gain=  
  audioContext.createGain();  
  
  osc.type=type;  
  
  osc.frequency.value=freq;  
  
  gain.gain.setValueAtTime(  
    .08,  
    audioContext.currentTime  
  );  
  
  gain.gain.exponentialRampToValueAtTime(  
    .001,  
    audioContext.currentTime+dur  
  );  
  
  osc.connect(gain);  
  
  gain.connect(  
    audioContext.destination  
  );  
  
  osc.start();  
  
  osc.stop(  
    audioContext.currentTime+dur  
  );  
}  
  
  
/* SOUND EXTRA */

let muted=false;
try{muted=localStorage.getItem("tomMuted")==="1";}catch(e){}

function tone(f1,f2,dur,type,vol,delay){
  if(!audioContext||muted) return;
  const t=audioContext.currentTime+(delay||0);
  const o=audioContext.createOscillator();
  const g=audioContext.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f1,t);
  if(f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);
  g.connect(audioContext.destination);
  o.start(t);
  o.stop(t+dur);
}

function noise(dur,vol,delay){
  if(!audioContext||muted) return;
  const n=Math.floor(audioContext.sampleRate*dur);
  const buf=audioContext.createBuffer(1,n,audioContext.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=audioContext.createBufferSource();
  const g=audioContext.createGain();
  s.buffer=buf;
  g.gain.value=vol;
  s.connect(g);
  g.connect(audioContext.destination);
  s.start(audioContext.currentTime+(delay||0));
}

function sfx(name){
  if(name==="jump"){
    tone(380,760,.14,"square",.06);
  }else if(name==="coin"){
    tone(988,988,.08,"square",.05);
    tone(1319,1319,.16,"square",.05,.07);
  }else if(name==="hit"){
    noise(.25,.25);
    tone(200,60,.3,"sawtooth",.1);
  }else if(name==="heart"){
    [523,659,784,1047].forEach(function(f,i){
      tone(f,f,.12,"triangle",.08,i*.07);
    });
  }else if(name==="over"){
    [392,330,262,196].forEach(function(f,i){
      tone(f,f*.98,.28,"triangle",.1,i*.22);
    });
  }
}

/* BACKGROUND MUSIC */

const chordRoots=[110,87.3,130.8,98];
const arps=[
  [440,523,659,523,440,523,659,880],
  [349,440,523,440,349,440,523,698],
  [523,659,784,659,523,659,784,1047],
  [392,494,587,494,392,494,587,784]
];
let musicTimer=null,musicStep=0,nextNoteTime=0;

function musicTick(){
  if(!audioContext||muted||paused||!gameRunning) return;
  const ahead=audioContext.currentTime+.25;
  if(nextNoteTime<audioContext.currentTime)
    nextNoteTime=audioContext.currentTime+.05;
  const stepDur=Math.max(.085,.135-(level-1)*.004);
  while(nextNoteTime<ahead){
    const delay=nextNoteTime-audioContext.currentTime;
    const st=musicStep%32;
    const chord=Math.floor(st/8);
    const inChord=st%8;

    /* arpeggio lead */
    const a=arps[chord][inChord];
    tone(a,a,stepDur*.8,"square",inChord===0?.04:.028,delay);

    /* driving bass (8th notes, octave pump) */
    if(st%2===0){
      const r=chordRoots[chord]*(((st/2)%2)?2:1);
      tone(r,r,stepDur*1.6,"sawtooth",.04,delay);
    }

    /* drums */
    if(st%4===0){
      tone(150,40,.13,"sine",.14,delay);
    }
    if(st%8===4){
      noise(.1,.10,delay);
      tone(200,120,.08,"triangle",.04,delay);
    }
    if(st%4===2){
      noise(.03,.05,delay);
    }

    nextNoteTime+=stepDur;
    musicStep++;
  }
}

function startMusic(){
  stopMusic();
  musicStep=0;
  nextNoteTime=0;
  musicTimer=setInterval(musicTick,80);
}

function stopMusic(){
  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }
}

  "pointerdown",  
  function(e){  
  
    e.preventDefault();  
  
    jump();  
  
  }  
);  
  
  
/* KEYBOARD */  
  
window.addEventListener(  
  "keydown",  
  function(e){  
  
    if(  
      e.code==="Space" ||  
      e.code==="ArrowUp"  
    ){  
  
      e.preventDefault();  
  
      if(  
        startScreen.style.display!=="none" &&  
        !gameRunning  
      ){  
  
        startGame();  
  
      }  
  
      else if(  
        gameOverEl.style.display==="block"  
      ){  
  
        startGame();  
  
      }  
  
      else{  
  
        jump();  
  
      }  
  
    }  
  
    if(  
      e.code==="KeyP" ||  
      e.code==="Escape"  
    ){  
  
      togglePause();  
  
    }  
  
  }  
);  
  
  
/* RECT */  
  
function getPlayerRect(){  
  
  const bottom=  
    GROUND_TOP+playerY;  
  
  return{  
  
    left:CHAR_LEFT,  
  
    right:CHAR_RIGHT,  
  
    bottom:bottom,  
  
    top:bottom+CHAR_HEIGHT  
  
  };  
  
}  
  
function getElRect(el){  
  
  const left=  
    parseFloat(el.style.left)+(el._sway||0);  
  
  const width=  
    el.offsetWidth;  
  
  const bottom=  
    parseFloat(el.style.bottom);  
  
  const height=  
    el.offsetHeight;  
  
  return{  
  
    left:left,  
  
    right:left+width,  
  
    bottom:bottom,  
  
    top:bottom+height  
  
  };  
  
}  
  
function overlap(a,b){  
  
  return(  
    a.left<b.right &&  
    a.right>b.left &&  
    a.bottom<b.top &&  
    a.top>b.bottom  
  );  
  
}  
  
  
/* COIN */  
  
function createCoin(){  
  
  const c=  
  document.createElement("div");  
  
  c.className="coin";  
  
  c.style.left=  
    (window.innerWidth+100)+"px";  
  
  const heights=[15,20,45,70];  
  
  c.style.bottom=  
    heights[  
      Math.floor(  
        Math.random()*heights.length  
      )  
    ]+GROUND_TOP+"px";  
  
  document.body.appendChild(c);  
  
  spawnCoinTrail(c);

  return c;  
  
}  
  
let coin=null;

let extraCoins=[];

function spawnCoinTrail(main){
  const n=1+Math.floor(Math.random()*2);
  const baseLeft=parseFloat(main.style.left);
  for(let i=1;i<=n;i++){
    const c=document.createElement("div");
    c.className="coin";
    c.style.left=(baseLeft+i*65)+"px";
    c.style.bottom=main.style.bottom;
    document.body.appendChild(c);
    extraCoins.push(c);
  }
}  
  
  
/* OBSTACLES */  
  
const obstacleTypes=[  
  "block",  
  "spike",  
  "rock",  
  "wall",  
  "barrel"  
];  
  
/* FAIR SPACING: no impossible obstacle combos */

function farthestObstacleEdge(){
  let edge=0;
  const list=extraObstacles.slice();
  if(obstacle) list.push(obstacle);
  list.forEach(function(el){
    if(!el.parentNode) return;
    const e=parseFloat(el.style.left)+el.offsetWidth+
      (el.dataset.sway==="1"?70:0);
    if(e>edge) edge=e;
  });
  return edge;
}

function neededGap(){
  return 55*gameSpeed+130;
}

function createObstacle(){  
  
  const o=  
  document.createElement("div");  
  
  o.className="obstacle";  
  
  let upperChance=  
    Math.min(  
      .20+level*.015,  
      .35  
    );  
  
  if(Math.random()<upperChance){  
  
    o.classList.add("upper");  
  
    o.dataset.type="upper";

    if(Math.random()<.6){
      o.dataset.sway="1";
      o._phase=Math.random()*6.28;
    }  
  
    o.style.bottom=(GROUND_TOP+175)+"px";  
  
  }  
  
  else{  
  
    let type=  
      obstacleTypes[  
        Math.floor(  
          Math.random()*  
          obstacleTypes.length  
        )  
      ];  
  
    o.classList.add(type);  
  
    o.dataset.type="lower";  
  
    o.style.bottom=GROUND_TOP+"px";  
  
  }  
  
  /*  
    Minimum distance changed slightly  
    so obstacles don't appear too close.  
  */  
  
  const minDistance=  
    400+Math.random()*400;  
  
  let left=window.innerWidth+minDistance;
  const need=farthestObstacleEdge()+neededGap()+
    (o.dataset.sway==="1"?70:0);
  if(left<need) left=need;
  o.style.left=left+"px";  
  
  document.body.appendChild(o);  
  
  return o;  
  
}  
  
let obstacle=null;  
  
let obstacleHit=false;  
  
  
/* EXTRA OBSTACLES */  
  
let extraObstacles=[];  
  
let extraSpawnTimer=null;  
  
function createExtraObstacle(){  
  
  if(  
    !gameRunning ||  
    paused  
  ){  
  
    return;  
  
  }  
  
  const o=  
  document.createElement("div");  
  
  let type=  
    obstacleTypes[  
      Math.floor(  
        Math.random()*  
        obstacleTypes.length  
      )  
    ];  
  
  o.className=  
    "obstacle "+type;  
  
  o.dataset.type="lower";  
  
  o.dataset.hit="0";  
  
  o.style.bottom=GROUND_TOP+"px";  
  
  let left=window.innerWidth+250+Math.random()*300;
  const need=farthestObstacleEdge()+neededGap();
  if(left<need) left=need;
  o.style.left=left+"px";  
  
  document.body.appendChild(o);  
  
  extraObstacles.push(o);  
  
}  
  
  
/* START GAME */  
  
function startGame(){  
  
  initAudio();  
  
  if(  
    audioContext &&  
    audioContext.state==="suspended"  
  ){  
  
    audioContext.resume();  
  
  }  
  
  startMusic();

  /*  
    IMPORTANT:  
    Previous high score রাখা হচ্ছে.  
  */  
  
  gameRunning=true;  
  
  paused=false;  
  
  score=0;  
  
  lives=3;  
  
  gameSpeed=3;  
  
  level=1;  
  
  playerY=0;  
  
  velocityY=0;  
  
  jumpsUsed=0;  
  
  invincible=false;  
  
  obstacleHit=false;  
  
  
  scoreText.innerText=  
    "Score: 0";  
  
  livesText.innerText=  
    "❤️ ❤️ ❤️";  
  
  levelText.innerText=  
    "Level: 1";  
  
  speedText.innerText=  
    "⚡ Speed: 3";  
  
  
  gameOverEl.style.display=  
    "none";  
  
  pauseScreen.style.display=  
    "none";  
  
  startScreen.style.display=  
    "none";  
  
  pauseBtn.innerText=  
    "⏸ PAUSE";  
  
  
  /* CLEAN OLD OBJECTS */  
  
  if(coin){  
  
    coin.remove();  
  
    coin=null;  
  
  }  
  
  if(obstacle){  
  
    obstacle.remove();  
  
    obstacle=null;  
  
  }  
  
  extraObstacles.forEach(  
    function(o){  
  
      if(o.parentNode)  
        o.remove();  
  
    }  
  );  
  
  extraObstacles=[];  
  
  if(extraSpawnTimer){  
  
    clearTimeout(  
      extraSpawnTimer  
    );  
  
    extraSpawnTimer=null;  
  
  }  
  
  
  extraCoins.forEach(function(c){if(c.parentNode)c.remove();});
  extraCoins=[];

  if(heart){heart.remove();heart=null;}
  heartCountdown=1200;

  /* CREATE NEW */  
  
  coin=createCoin();  
  
  obstacle=createObstacle();  
  
  
  if(!animationStarted){  
  
    animationStarted=true;  
  
    lastTime=  
      performance.now();  
  
    requestAnimationFrame(  
      gameLoop  
    );  
  
  }  
  
}  
  
startBtn.addEventListener(  
  "click",  
  startGame  
);  
  
restartBtn.addEventListener(  
  "click",  
  startGame  
);  
  
  
/* PAUSE */  
  
function togglePause(){  
  
  if(!gameRunning)  
    return;  
  
  paused=!paused;  
  
  pauseScreen.style.display=  
    paused ? "block" : "none";  
  
  pauseBtn.innerText=  
    paused  
      ? "▶ RESUME"  
      : "⏸ PAUSE";  
  
}  
  
pauseBtn.addEventListener(  
  "pointerdown",  
  function(e){  
  
    e.preventDefault();  
  
    togglePause();  
  
  }  
);  
  
resumeBtn.addEventListener(  
  "click",  
  togglePause  
);  
  
  
/* DIFFICULTY */  
  
function updateDifficulty(){  
  
  /*  
    Level every 15 score.  
    Maximum speed = 7.  
  */  
  
  level=  
    1+  
    Math.floor(score/15);  
  
  gameSpeed=  
    3+  
    (level-1)*.35;  
  
  if(gameSpeed>7)  
    gameSpeed=7;  
  
  levelText.innerText=  
    "Level: "+level;  
  
  speedText.innerText=  
    "⚡ Speed: "+  
    gameSpeed.toFixed(1);  
  
}  
  
  
/* HIGH SCORE */  
  
function updateHighScore(){  
  
  if(score>highScore){  
  
    highScore=score;  
  
    saveHighScore(  
      highScore  
    );  
  
    highScoreText.innerText=  
      "🏆 High Score: "+  
      highScore;  
  
  }  
  
}  
  
  
/* LIVES */  
  
function updateLives(){

  livesText.innerText=
    "❤️ ".repeat(lives)+
    "🖤 ".repeat(Math.max(0,3-lives));

}  
  
  
/* DAMAGE */  
  
function takeDamage(){  
  
  if(invincible)  
    return;  
  
  lives--;  
  
  updateLives();  
  
  sfx("hit");  
  
  character.classList.add(  
    "hitFlash"  
  );  
  
  invincible=true;  
  
  setTimeout(  
    function(){  
  
      character.classList.remove(  
        "hitFlash"  
      );  
  
      invincible=false;  
  
    },  
    1000  
  );  
  
  if(lives<=0){  
  
    endGame();  
  
  }  
  
}  
  
  
/* COIN UPDATE */  
  
function updateCoin(dt){  
  
  if(!coin)  
    return;  
  
  let x=  
    parseFloat(  
      coin.style.left  
    );  
  
  x-=gameSpeed*dt;  
  
  coin.style.left=  
    x+"px";  
  
  
  const pr=  
    getPlayerRect();  
  
  const cr=  
    getElRect(coin);  
  
  
  if(overlap(pr,cr)){  
  
    score++;  
  
    scoreText.innerText=  
      "Score: "+score;  
  
    updateHighScore();  
  
    sfx("coin");  
  
    coin.remove();  
  
    coin=createCoin();  
  
  }  
  
  
  if(x<-70){  
  
    coin.remove();  
  
    coin=createCoin();  
  
  }  
  
}  
  
  
/* EXTRA COINS */

function updateExtraCoins(dt){
  const pr=getPlayerRect();
  for(let i=extraCoins.length-1;i>=0;i--){
    const c=extraCoins[i];
    const x=parseFloat(c.style.left)-gameSpeed*dt;
    c.style.left=x+"px";
    if(overlap(pr,getElRect(c))){
      score++;
      scoreText.innerText="Score: "+score;
      updateHighScore();
      sfx("coin");
      c.remove();
      extraCoins.splice(i,1);
    }else if(x<-70){
      c.remove();
      extraCoins.splice(i,1);
    }
  }
}

/* HEART PICKUP (extra life) */

let heart=null;
let heartCountdown=1200;
const MAX_LIVES=5;

function updateHeart(dt){
  if(!heart){
    heartCountdown-=dt;
    if(heartCountdown<=0 && lives<MAX_LIVES){
      const h=document.createElement("div");
      h.className="heart";
      h.innerText="❤️";
      h.style.left=(window.innerWidth+100)+"px";
      const hs=[20,45,70];
      h.style.bottom=(hs[Math.floor(Math.random()*hs.length)]+GROUND_TOP)+"px";
      document.body.appendChild(h);
      heart=h;
    }
    return;
  }
  const x=parseFloat(heart.style.left)-gameSpeed*dt;
  heart.style.left=x+"px";
  if(overlap(getPlayerRect(),getElRect(heart))){
    lives=Math.min(MAX_LIVES,lives+1);
    updateLives();
    sfx("heart");
    heart.remove();
    heart=null;
    heartCountdown=1500+Math.random()*1200;
  }else if(x<-70){
    heart.remove();
    heart=null;
    heartCountdown=900+Math.random()*900;
  }
}

/* MAIN OBSTACLE */  
  
function updateMainObstacle(dt){  
  
  if(!obstacle)  
    return;  
  
  let x=  
    parseFloat(  
      obstacle.style.left  
    );  
  
  x-=gameSpeed*dt;  
  
  obstacle.style.left=  
    x+"px";

  if(obstacle.dataset.sway==="1"){
    obstacle._sway=
      Math.sin(performance.now()/350+obstacle._phase)*70;
    obstacle.style.transform=
      "translateX("+obstacle._sway+"px)";
  }  
  
  
  const pr=  
    getPlayerRect();  
  
  const or_=  
    getElRect(obstacle);  
  
  
  if(  
    !obstacleHit &&  
    overlap(pr,or_)  
  ){  
  
    obstacleHit=true;  
  
    takeDamage();  
  
  }  
  
  
  if(x<-150){  
  
    obstacle.remove();  
  
    obstacle=createObstacle();  
  
    obstacleHit=false;  
  
  
    /*  
      Extra obstacle only after score 8.  
      Chance increases slightly with level.  
    */  
  
    let extraChance=  
      Math.min(  
        .35+(level*.02),  
        .55  
      );  
  
    if(  
      score>3 &&  
      Math.random()<extraChance  
    ){  
  
      if(extraSpawnTimer)  
        clearTimeout(  
          extraSpawnTimer  
        );  
  
      extraSpawnTimer=  
        setTimeout(  
          function(){  
  
            extraSpawnTimer=null;  
  
            createExtraObstacle();  
  
          },  
          550+Math.random()*350  
        );  
  
    }  
  
  }  
  
}  
  
  
/* EXTRA OBSTACLES */  
  
function updateExtraObstacles(dt){  
  
  for(  
    let i=extraObstacles.length-1;  
    i>=0;  
    i--  
  ){  
  
    const o=  
      extraObstacles[i];  
  
    if(!o.parentNode){  
  
      extraObstacles.splice(i,1);  
  
      continue;  
  
    }  
  
  
    let x=  
      parseFloat(  
        o.style.left  
      );  
  
    x-=gameSpeed*dt;  
  
    o.style.left=  
      x+"px";  
  
  
    const pr=  
      getPlayerRect();  
  
    const or_=  
      getElRect(o);  
  
  
    if(  
      o.dataset.hit!=="1" &&  
      overlap(pr,or_)  
    ){  
  
      o.dataset.hit="1";  
  
      takeDamage();  
  
    }  
  
  
    if(x<-150){  
  
      o.remove();  
  
      extraObstacles.splice(i,1);  
  
    }  
  
  }  
  
}  
  
  
/* GAME LOOP */  
  
function gameLoop(timestamp){  
  
  if(!gameRunning){  
  
    animationStarted=false;  
  
    return;  
  
  }  
  
  
  let dt=  
    (timestamp-lastTime)/  
    16.6667;  
  
  
  if(  
    !isFinite(dt) ||  
    dt<0  
  ){  
  
    dt=1;  
  
  }  
  
  
  dt=  
    Math.min(dt,3);  
  
  lastTime=timestamp;  
  
  
  if(!paused){  
  
    /* PLAYER */  
  
    playerY+=  
      velocityY*dt;  
  
    velocityY-=  
      gravity*dt;  
  
  
    if(playerY<=groundY){  
  
      playerY=groundY;  
  
      velocityY=0;  
  
      jumpsUsed=0;  
  
    }  
  
  
    character.style.transform=  
      "translateY("+  
      (-playerY)+  
      "px)";

    var tilt=0;
    if(playerY>0){
      tilt=Math.max(-14,Math.min(12,-velocityY*1.1));
    }
    charImg.style.transform="rotate("+tilt+"deg)";  
  
  
    /* SYSTEMS */  
  
    scrollBg(dt);
    
    updateDifficulty();  
  
    updateCoin(dt);
  
    updateExtraCoins(dt);
  
    updateHeart(dt);  
  
    updateMainObstacle(dt);  
  
    updateExtraObstacles(dt);  
  
  }  
  
  
  requestAnimationFrame(  
    gameLoop  
  );  
  
}  
  
  
/* GAME OVER */  
  
function endGame(){  
  
  /*  
    এই score-টা আগে save করার  
    আগেই record কিনা সেটা ধরছি।  
  */  
  
  const wasNewRecord=  
    score>highScore;  
  
  
  if(wasNewRecord){  
  
    highScore=score;  
  
    saveHighScore(  
      highScore  
    );  
  
    highScoreText.innerText=  
      "🏆 High Score: "+  
      highScore;  
  
  }  
  
  
  gameRunning=false;  
  
  paused=false;  
  
  
  finalScore.innerText=  
    "🎯 Score: "+score;  
  
  bestScore.innerText=  
    "🏆 Best Score: "+  
    highScore;  
  
  
  /*  
    FIXED:  
    শুধু সত্যিই নতুন record হলে  
    NEW RECORD দেখাবে।  
  */  
  
  newRecord.style.display=  
    wasNewRecord  
      ? "block"  
      : "none";  
  
  
  gameOverEl.style.display=  
    "block";  
  
  pauseScreen.style.display=  
    "none";  
  
  
  stopMusic(); sfx("over");  
  
}  
  
  
/* PREVENT SCREEN SCROLL */  
  
document.addEventListener(  
  "touchmove",  
  function(e){  
  
    e.preventDefault();  
  
  },  
  {passive:false}  
);  
  
</script>  </body>
